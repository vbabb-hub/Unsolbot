name: Solana Paper Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione del Bot di Simulazione
        run: python src/simulator.py

      - name: Aggiorna la dashboard web e il README
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          touch index.html
          touch README.md
          touch src/portfolio.json
          
          git add src/portfolio.json README.md index.html
          git diff --staged --quiet || git commit -m "Update web dashboard and README [skip ci]"
          git push
