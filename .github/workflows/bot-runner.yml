name: Solana Paper Trading Bot

on:
  schedule:
    # Esegue il bot automaticamente ogni 15 minuti
    - cron: '*/15 * * * *'
  workflow_dispatch: # Consente anche l'avvio manuale dalla tab "Actions" di GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esecuzione del Bot di Simulazione
        run: python src/simulator.py
